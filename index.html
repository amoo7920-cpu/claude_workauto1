<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구글 트렌드 상세 기사 에이전트</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; font-size: 14px; }
  form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin: 20px 0;
  }
  label { font-size: 13px; color: var(--muted); }
  select, input[type="number"] {
    background: #0f1115;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: #08101f;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { color: var(--muted); font-size: 13px; min-height: 20px; margin: 8px 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .card .article { white-space: pre-wrap; font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 32px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>구글 트렌드 상세 기사 에이전트</h1>
  <p class="subtitle">실시간 인기 검색어와 관련 뉴스를 바탕으로 Claude가 상세 기사를 작성합니다.</p>

  <form id="form">
    <label>국가
      <select id="geo">
        <option value="KR">한국 (KR)</option>
        <option value="US">미국 (US)</option>
        <option value="JP">일본 (JP)</option>
      </select>
    </label>
    <label>개수
      <input type="number" id="limit" min="1" max="3" value="3" />
    </label>
    <button type="submit" id="submit-btn">기사 생성하기</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>

  <footer>
    구글 Trending Now RSS + Claude API 기반 · 서버리스 실행 시간 제한으로 최대 3건까지 생성됩니다.
  </footer>
</main>

<script>
  const form = document.getElementById("form");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const submitBtn = document.getElementById("submit-btn");

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const geo = document.getElementById("geo").value;
    const limit = document.getElementById("limit").value || 3;

    submitBtn.disabled = true;
    statusEl.textContent = "트렌드를 조회하고 기사를 작성하는 중입니다... (최대 1분 정도 걸릴 수 있습니다)";
    resultsEl.innerHTML = "";

    try {
      const res = await fetch(`/api/generate?geo=${encodeURIComponent(geo)}&limit=${encodeURIComponent(limit)}`);
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = data.error || "알 수 없는 오류가 발생했습니다.";
        return;
      }

      statusEl.textContent = `총 ${data.count}건의 기사를 생성했습니다.`;
      resultsEl.innerHTML = data.results.map((item) => `
        <div class="card">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="meta">추정 검색량: ${escapeHtml(item.approx_traffic || "정보 없음")}</div>
          <div class="article">${escapeHtml(item.article)}</div>
        </div>
      `).join("");
    } catch (err) {
      statusEl.textContent = "요청 중 오류가 발생했습니다: " + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
